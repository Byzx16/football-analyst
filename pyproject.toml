[project]
name = "football-analyst"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "redis>=5.0",
    "pytz>=2024.1",
    "pydantic-settings>=2.5",
    "google-generativeai>=0.8",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipython"]